<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; font-family: sans-serif;">
  <!-- Background -->
  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#0f172a" font-size="24" font-weight="bold">大语言模型（LLM）历史演变时间线</text>
  <text x="500" y="75" text-anchor="middle" fill="#475569" font-size="14">从 1957 年早期神经网络到 2025 年深度推理时代</text>

  <!-- Central Axis Line -->
  <line x1="80" y1="360" x2="910" y2="360" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" />
  <polygon points="925,360 910,352 910,368" fill="#7c3aed" />

  <!-- STAGE 1 -->
  <g transform="translate(130, 0)">
    <line x1="0" y1="360" x2="0" y2="240" stroke="#2563eb" stroke-width="2" stroke-dasharray="4" />
    <circle cx="0" cy="360" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
    <rect x="-75" y="100" width="150" height="140" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2" />
    <text x="0" y="125" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="bold">1957 - 1980s</text>
    <text x="0" y="155" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">萌芽与规则时代</text>
    <text x="-65" y="185" fill="#334155" font-size="11">- 1957年发明感知机</text>
    <text x="-65" y="205" fill="#334155" font-size="11">- 早期神经网络奠基</text>
    <text x="-65" y="225" fill="#334155" font-size="11">- 依赖人工语法规则</text>
  </g>

  <!-- STAGE 2 -->
  <g transform="translate(285, 0)">
    <line x1="0" y1="360" x2="0" y2="480" stroke="#0891b2" stroke-width="2" stroke-dasharray="4" />
    <circle cx="0" cy="360" r="8" fill="#ffffff" stroke="#0891b2" stroke-width="4" />
    <rect x="-75" y="480" width="150" height="140" rx="8" fill="#f8fafc" stroke="#0891b2" stroke-width="2" />
    <text x="0" y="505" text-anchor="middle" fill="#0891b2" font-size="14" font-weight="bold">1990s - 2012</text>
    <text x="0" y="535" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">统计与循环网络</text>
    <text x="-65" y="565" fill="#334155" font-size="11">- N-gram 统计词频</text>
    <text x="-65" y="585" fill="#334155" font-size="11">- 1997年提出 LSTM</text>
    <text x="-65" y="605" fill="#334155" font-size="11">- 2003年神经词向量</text>
  </g>

  <!-- STAGE 3 -->
  <g transform="translate(440, 0)">
    <line x1="0" y1="360" x2="0" y2="240" stroke="#059669" stroke-width="2" stroke-dasharray="4" />
    <circle cx="0" cy="360" r="8" fill="#ffffff" stroke="#059669" stroke-width="4" />
    <rect x="-75" y="100" width="150" height="140" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="2" />
    <text x="0" y="125" text-anchor="middle" fill="#059669" font-size="14" font-weight="bold">2013 - 2016</text>
    <text x="0" y="155" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">深度学习与词向量</text>
    <text x="-65" y="185" fill="#334155" font-size="11">- Word2Vec 语义空间</text>
    <text x="-65" y="205" fill="#334155" font-size="11">- Seq2Seq 广泛应用</text>
    <text x="-65" y="225" fill="#334155" font-size="11">- 引入早期注意力</text>
  </g>

  <!-- STAGE 4 -->
  <g transform="translate(595, 0)">
    <line x1="0" y1="360" x2="0" y2="480" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4" />
    <circle cx="0" cy="360" r="8" fill="#ffffff" stroke="#7c3aed" stroke-width="4" />
    <rect x="-75" y="480" width="150" height="140" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="2" />
    <text x="0" y="505" text-anchor="middle" fill="#7c3aed" font-size="14" font-weight="bold">2017 - 2021</text>
    <text x="0" y="535" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">架构统一与预训练</text>
    <text x="-65" y="565" fill="#334155" font-size="11">- Transformer 诞生</text>
    <text x="-65" y="585" fill="#334155" font-size="11">- BERT与GPT底座分化</text>
    <text x="-65" y="605" fill="#334155" font-size="11">- GPT-3 带来涌现能力</text>
  </g>

  <!-- STAGE 5 -->
  <g transform="translate(750, 0)">
    <line x1="0" y1="360" x2="0" y2="240" stroke="#e11d48" stroke-width="2" stroke-dasharray="4" />
    <circle cx="0" cy="360" r="8" fill="#ffffff" stroke="#e11d48" stroke-width="4" />
    <rect x="-75" y="100" width="150" height="140" rx="8" fill="#f8fafc" stroke="#e11d48" stroke-width="2" />
    <text x="0" y="125" text-anchor="middle" fill="#e11d48" font-size="14" font-weight="bold">2022 - 2024</text>
    <text x="0" y="155" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">对齐与多模态</text>
    <text x="-65" y="185" fill="#334155" font-size="11">- ChatGPT 破圈爆发</text>
    <text x="-65" y="205" fill="#334155" font-size="11">- RLHF 人类意图对齐</text>
    <text x="-65" y="225" fill="#334155" font-size="11">- MLLM 多模态融合</text>
  </g>

  <!-- STAGE 6 -->
  <g transform="translate(890, 0)">
    <line x1="0" y1="360" x2="0" y2="480" stroke="#db2777" stroke-width="2" stroke-dasharray="4" />
    <circle cx="0" cy="360" r="8" fill="#ffffff" stroke="#db2777" stroke-width="4" />
    <rect x="-75" y="480" width="150" height="140" rx="8" fill="#f8fafc" stroke="#db2777" stroke-width="2" />
    <text x="0" y="505" text-anchor="middle" fill="#db2777" font-size="14" font-weight="bold">2024 - 2025</text>
    <text x="0" y="535" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">推理与低成本变革</text>
    <text x="-65" y="565" fill="#334155" font-size="11">- o1 长思维链深度推理</text>
    <text x="-65" y="585" fill="#334155" font-size="11">- 慢思考逻辑推演</text>
    <text x="-65" y="605" fill="#334155" font-size="11">- DeepSeek 极致性价比</text>
  </g>
</svg>