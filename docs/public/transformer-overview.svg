<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#5479B8" stroke-width="1.5"/></marker><style>
.t{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#243B5A}.h{font-size:30px;font-weight:bold}.s{font-size:19px}.b{stroke-width:2;rx:14}.a{stroke:#5479B8;stroke-width:2.5;fill:none;marker-end:url(#a)}
</style></defs>
<rect width="1100" height="1040" rx="24" fill="#F5F8FE"/>
<text x="550" y="52" text-anchor="middle" class="t h">Transformer 整体处理流程</text>
<text x="550" y="84" text-anchor="middle" class="t s">从输入文本到下一个 Token 的预测</text>
<rect x="300" y="115" width="500" height="62" class="b" fill="#DCEBFF" stroke="#75A9EF"/><text x="550" y="153" text-anchor="middle" class="t s">输入文本：我喜欢人工智能</text>
<path d="M550 177V207" class="a"/>
<rect x="300" y="212" width="500" height="62" class="b" fill="#E8E2FF" stroke="#A28BE8"/><text x="550" y="250" text-anchor="middle" class="t s">Tokenizer：切分文本并映射为 Token ID</text>
<path d="M550 274V304" class="a"/>
<rect x="300" y="309" width="500" height="62" class="b" fill="#DDF5EB" stroke="#70C49B"/><text x="550" y="347" text-anchor="middle" class="t s">Token Embedding：Token ID → 向量</text>
<path d="M550 371V401" class="a"/>
<rect x="300" y="406" width="500" height="62" class="b" fill="#FFF0D8" stroke="#E8B55F"/><text x="550" y="444" text-anchor="middle" class="t s">位置信息：位置编码 / RoPE 等</text>
<path d="M550 468V498" class="a"/>
<rect x="190" y="503" width="720" height="290" rx="18" fill="#EAF1FF" stroke="#6E94D4" stroke-width="2"/>
<text x="550" y="540" text-anchor="middle" class="t" font-size="24" font-weight="bold">Transformer Blocks × N</text>
<rect x="260" y="560" width="580" height="70" rx="12" fill="#D9E7FF" stroke="#75A9EF" stroke-width="2"/><text x="550" y="588" text-anchor="middle" class="t s">Masked Self-Attention</text><text x="550" y="614" text-anchor="middle" class="t" font-size="16">结合上下文，交换 Token 之间的信息</text>
<rect x="260" y="650" width="580" height="70" rx="12" fill="#DDF5EB" stroke="#70C49B" stroke-width="2"/><text x="550" y="678" text-anchor="middle" class="t s">Feed Forward Network（FFN）</text><text x="550" y="704" text-anchor="middle" class="t" font-size="16">对每个位置的特征进行非线性变换</text>
<text x="550" y="762" text-anchor="middle" class="t" font-size="16">每个子层还包含归一化与残差连接</text>
<path d="M550 793V823" class="a"/>
<rect x="300" y="828" width="500" height="62" rx="12" fill="#E8E2FF" stroke="#A28BE8" stroke-width="2"/><text x="550" y="866" text-anchor="middle" class="t s">Final Norm → Linear → Logits</text>
<path d="M550 890V920" class="a"/>
<rect x="300" y="925" width="500" height="62" rx="12" fill="#DDF5EB" stroke="#70C49B" stroke-width="2"/><text x="550" y="963" text-anchor="middle" class="t s">概率分布 → 选择下一个 Token</text>
<text x="550" y="1018" text-anchor="middle" class="t" font-size="16">将新 Token 加入上下文，继续下一轮生成</text>
</svg>