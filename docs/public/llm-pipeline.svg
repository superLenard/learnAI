<svg xmlns="http://www.w3.org/2000/svg" width="560" height="660" viewBox="0 0 560 660" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/>
    </marker>
  </defs>
  <rect width="560" height="660" rx="14" fill="#f8faff"/>

  <text x="280" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">大模型原理流水线</text>
  <text x="280" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">一段文本，如何一步步变成"预测的下一个词"</text>

  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <!-- 1 输入 -->
    <rect x="120" y="78" width="320" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="280" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">① 输入文本</text>
    <text x="280" y="125" text-anchor="middle" font-size="12.5" fill="#64748b">"今天天气很好"</text>

    <line x1="280" y1="140" x2="280" y2="164" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrp)"/>

    <!-- 2 分词 -->
    <rect x="120" y="166" width="320" height="62" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="280" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">② 分词器 Tokenizer</text>
    <text x="280" y="213" text-anchor="middle" font-size="12.5" fill="#64748b">切成 token 序列</text>

    <line x1="280" y1="228" x2="280" y2="252" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrp)"/>

    <!-- 3 token -->
    <rect x="110" y="254" width="340" height="62" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="280" y="279" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">③ Token 序列</text>
    <text x="280" y="301" text-anchor="middle" font-size="12.5" fill="#64748b">[今天] [天气] [很] [好]</text>

    <line x1="280" y1="316" x2="280" y2="340" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrp)"/>

    <!-- 4 embedding -->
    <rect x="120" y="342" width="320" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="280" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">④ 词嵌入 Embedding</text>
    <text x="280" y="389" text-anchor="middle" font-size="12.5" fill="#64748b">token → 向量 + 位置信息</text>

    <line x1="280" y1="404" x2="280" y2="428" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrp)"/>

    <!-- 5 transformer -->
    <rect x="100" y="430" width="360" height="70" rx="10" fill="url(#pg)"/>
    <text x="280" y="457" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">⑤ Transformer 层（×N）</text>
    <text x="280" y="481" text-anchor="middle" font-size="12.5" fill="#ede9fe">自注意力 · 前馈网络 反复提炼信息</text>

    <line x1="280" y1="500" x2="280" y2="524" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrp)"/>

    <!-- 6 softmax -->
    <rect x="120" y="526" width="320" height="62" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="280" y="551" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">⑥ 输出层 + Softmax</text>
    <text x="280" y="573" text-anchor="middle" font-size="12.5" fill="#64748b">给每个候选词打分、归一化</text>

    <line x1="280" y1="588" x2="280" y2="610" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrp)"/>

    <!-- 7 结果 -->
    <rect x="140" y="612" width="280" height="38" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="280" y="636" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">⑦ 预测下一个词：概率最高者</text>
  </g>
</svg>
